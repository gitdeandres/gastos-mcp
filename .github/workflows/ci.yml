name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Instalar uv (misma versión que en local y en el Dockerfile)
        run: |
          curl -LsSf https://astral.sh/uv/0.13.1/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Dependencias (falla si uv.lock no coincide con pyproject)
        run: uv sync --locked
      - name: Tests unitarios (la integración queda excluida por addopts)
        run: uv run pytest
      - name: Lint
        run: uvx ruff check
