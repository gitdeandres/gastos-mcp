name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Las acciones van fijadas por el SHA completo del commit (el comentario indica la versión):
      # una etiqueta como @v7 se puede mover; un SHA no. Dependabot las actualiza (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar uv (misma versión que en local y en el Dockerfile)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          # Sin caché: el job dura segundos y una caché compartida es una superficie de ataque innecesaria.
          enable-cache: false
      - name: Dependencias (falla si uv.lock no coincide con pyproject)
        run: uv sync --locked
      - name: Tests unitarios (la integración queda excluida por addopts)
        run: uv run pytest
      - name: Lint (ruff fijado en uv.lock)
        run: uv run ruff check
