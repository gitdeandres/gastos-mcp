[project]
name = "gastos-mcp"
version = "0.2.0"
description = "MCP de Gastos: registro y consulta de precios de supermercado en Google Sheets"
# Expresión SPDX (PEP 639). No se declara `license-files` ni `readme`: el build de la imagen solo ve
# pyproject.toml, uv.lock, .python-version y src/ (.dockerignore), y un fichero declarado que falte lo rompería.
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # SDK oficial v2.
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    # Importados directamente en server.py y auth.py (también los trae mcp, pero se declaran).
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.scripts]
# `uv run gastos-mcp` arranca el servidor.
gastos-mcp = "gastos_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# En los tests, las tablas de datos se leen mejor en una sola línea.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: prueba contra la hoja de pruebas real (necesita credenciales y TEST_SPREADSHEET_ID)",
]
# Por defecto NO se ejecutan las pruebas de integración: `pytest -m integration` las activa.
addopts = "-m 'not integration'"
